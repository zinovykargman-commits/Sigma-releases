name: Publish Neon District APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release repository
        uses: actions/checkout@v5

      - name: Download and verify APK
        env:
          APK_SOURCE_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-f454-822f-bc18-f2c30e35e89a/raw?se=2026-08-01T22:56:42Z&sp=r&sv=2026-02-06&sr=b&scid=6b34487d-8700-4fb0-a0fe-8e7684dba8c4&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T11:53:06Z&ske=2026-08-02T11:53:06Z&sks=b&skv=2026-02-06&sig=ks7D2%2B60CYdvtR2/vAG9MR81do759evqSNmpTE7WMN4%3D'
          APK_SHA256: fd90e308dc255322f931a0022f716d71ea33f4bc9580e06d1d5862fa87f9157f
        run: |
          curl -L --fail --retry 3 "$APK_SOURCE_URL" -o /tmp/NeonDistrict-APK.zip
          unzip -o /tmp/NeonDistrict-APK.zip NeonDistrict.apk
          echo "$APK_SHA256  NeonDistrict.apk" | sha256sum -c -

      - name: Publish permanent APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- NeonDistrict.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Neon District 0.1.2 APK"
          git push origin HEAD:main
