name: Publish Neon District APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release repository
        uses: actions/checkout@v5

      - name: Download and verify signed v0.1.3
        env:
          APK_ARCHIVE_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-ed70-822f-8b11-b0e8e9ee628b/raw?se=2026-08-01T23:36:49Z&sp=r&sv=2026-02-06&sr=b&scid=fc185054-41a3-45b9-b86d-1dc5123c234e&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T23:56:15Z&ske=2026-08-02T23:56:15Z&sks=b&skv=2026-02-06&sig=4F5A0pKclRJIXr22Gfxxp482ZbXOmUx5drQZmL3IFD8%3D'
          APK_ARCHIVE_SHA256: 3bea6199478b9cd979337c1489478440de7e5167b07f661e80436bdccbb7b932
        run: |
          curl -L --fail --retry 3 "$APK_ARCHIVE_URL" -o /tmp/NeonDistrict-v0.1.3.zip
          echo "$APK_ARCHIVE_SHA256  /tmp/NeonDistrict-v0.1.3.zip" | sha256sum -c -
          unzip -o /tmp/NeonDistrict-v0.1.3.zip NeonDistrict.apk
          test -s NeonDistrict.apk
          echo "APK_SHA256=$(sha256sum NeonDistrict.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish APK and activate update
        run: |
          jq -n \
            --arg apk_url "https://raw.githubusercontent.com/zinovykargman-commits/Sigma-releases/main/NeonDistrict.apk" \
            --arg sha256 "$APK_SHA256" \
            '{
              version_code: 4,
              version_name: "0.1.3",
              apk_url: $apk_url,
              sha256: $sha256,
              notes: "Permanent in-app updater: downloads inside Neon District and opens the Android installer."
            }' > latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- NeonDistrict.apk latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish and activate Neon District 0.1.3"
          git push origin HEAD:main
